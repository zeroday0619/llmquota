name: llmquota
description: A desktop overlay for AI subscription quotas and reset times.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.47.6'

dependencies:
  flutter:
    sdk: flutter
  gbt_fluent2_ui: 7.0.0
  window_manager: ^0.5.2

dependency_overrides:
  gbt_fluent2_ui:
    path: third_party/gbt_fluent2_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - pubspec.yaml
    - LICENSE
